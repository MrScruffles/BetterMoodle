name: Build extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          mkdir -p dist
          FILES="manifest.json content styles.css"
          zip -r "dist/BetterMoodle-chrome-${{ steps.meta.outputs.version }}.zip" $FILES
          zip -r "dist/BetterMoodle-firefox-${{ steps.meta.outputs.version }}.xpi" $FILES

      - name: Sign Firefox build
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p stage signed
          cp -r manifest.json content styles.css stage/
          npx --yes web-ext sign --source-dir stage --artifacts-dir signed --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          cp signed/*.xpi "dist/BetterMoodle-firefox-${{ steps.meta.outputs.version }}.xpi"

      - uses: actions/upload-artifact@v4
        with:
          name: BetterMoodle-${{ steps.meta.outputs.version }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
